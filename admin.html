<script>
	function validateEmailInput(input) {
		var emailRegex = /^[A-Za-z0-9]+@[A-Za-z0-9]+(\.[A-Za-z0-9]+)+$/;
		var error = input.parentElement ? input.parentElement.querySelector('.email-error') : (input.parentElement ? input.parentElement.parentElement.querySelector('.email-error') : null);
		if (!error && input.parentElement) {
			error = input.parentElement.querySelector('.footer-news-error');
		}
		if (input.value.trim() === '') {
			if (error) error.style.display = 'none';
			input.classList.remove('is-invalid');
			return;
		}
		if (emailRegex.test(input.value.trim())) {
			if (error) error.style.display = 'none';
			input.classList.remove('is-invalid');
		} else {
			if (error) error.style.display = 'block';
			input.classList.add('is-invalid');
		}
	}
	document.addEventListener('DOMContentLoaded', function() {
		var forms = document.querySelectorAll('form');
		var emailRegex = /^[A-Za-z0-9]+@[A-Za-z0-9]+(\.[A-Za-z0-9]+)+$/;
		forms.forEach(function(form) {
			form.addEventListener('submit', function(e) {
				var emailInputs = form.querySelectorAll('.email-input, .footer-news-input, input[type="email"]');
				var hasInvalid = false;
				emailInputs.forEach(function(input) {
					var val = input.value.trim();
					if (!emailRegex.test(val)) {
						hasInvalid = true;
						var error = input.parentElement ? input.parentElement.querySelector('.email-error, .footer-news-error') : null;
						if (error) error.style.display = 'block';
						input.classList.add('is-invalid');
						input.focus();
					}
				});
				if (hasInvalid) {
					e.preventDefault();
				}
			});
		});
	});
</script>
<script>function initProfile(){try{var n=localStorage.getItem("userName")||"User";var r=localStorage.getItem("userRole")||"";var ini=n.trim().split(/\s+/).filter(Boolean).map(function(x){return x[0]||"";}).join("").substring(0,2).toUpperCase();var el=document.getElementById("sideUserName");if(el)el.textContent=n;el=document.getElementById("sideUserRole");if(el)el.textContent=r;var av=document.getElementById("sideAvatar");if(av){if(av.tagName==="IMG"){av.alt=n;}else{av.textContent=ini;}}}catch(e){}};document.addEventListener("DOMContentLoaded",initProfile);</script></body>
