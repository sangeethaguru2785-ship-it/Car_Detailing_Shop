<script>
	function validateEmailInput(input) {
		var emailRegex = /^[A-Za-z0-9]+@[A-Za-z0-9]+(\.[A-Za-z0-9]+)+$/;
		var error = input.parentElement ? input.parentElement.querySelector('.email-error') : (input.parentElement ? input.parentElement.parentElement.querySelector('.email-error') : null);
		if (!error && input.parentElement) {
			error = input.parentElement.querySelector('.footer-news-error');
		}
		if (input.value.trim() === '') {
			if (error) error.style.display = 'none';
			input.classList.remove('is-invalid');
			return;
		}
		if (emailRegex.test(input.value.trim())) {
			if (error) error.style.display = 'none';
			input.classList.remove('is-invalid');
		} else {
			if (error) error.style.display = 'block';
			input.classList.add('is-invalid');
		}
	}
	document.addEventListener('DOMContentLoaded', function() {
		var forms = document.querySelectorAll('form');
		var emailRegex = /^[A-Za-z0-9]+@[A-Za-z0-9]+(\.[A-Za-z0-9]+)+$/;
		forms.forEach(function(form) {
			form.addEventListener('submit', function(e) {
				var emailInputs = form.querySelectorAll('.email-input, .footer-news-input, input[type="email"]');
				var hasInvalid = false;
				emailInputs.forEach(function(input) {
					var val = input.value.trim();
					if (!emailRegex.test(val)) {
						hasInvalid = true;
						var error = input.parentElement ? input.parentElement.querySelector('.email-error, .footer-news-error') : null;
						if (error) error.style.display = 'block';
						input.classList.add('is-invalid');
						input.focus();
					}
				});
				if (hasInvalid) {
					e.preventDefault();
				}
			});
		});
	});
</script>
<script>
(function(){
  try {
    var r = localStorage.getItem('userRole') || (window.DB && DB.currentUser() && DB.currentUser().role);
    var p = location.pathname.split('/').pop() || 'admin.html';
    if (p === 'admin.html' && r === 'customer') { window.location.replace('customer.html'); return; }
    if (p === 'customer.html' && r === 'admin') { window.location.replace('admin.html'); return; }
  } catch(e) {}
})();
function initProfile(){
  try {
    var user = (window.DB && typeof DB.currentUser === 'function') ? DB.currentUser() : null;
    var n = (user && user.name) || localStorage.getItem("userName") || "User";
    var r = (user && user.role) || localStorage.getItem("userRole") || "admin";
    var e = (user && user.email) || localStorage.getItem("userEmail") || "";
    var roleLabel = r === 'admin' ? 'Administrator' : (r === 'customer' ? 'Customer' : r);
    var ini = (n.trim().charAt(0) || "U").toUpperCase();
    var first = n.trim().split(/\s+/)[0] || n;

    var el = document.getElementById("sideUserName"); if(el) el.textContent = n;
    el = document.getElementById("topUserName"); if(el) el.textContent = n;
    el = document.getElementById("menuName"); if(el) el.textContent = n;
    el = document.getElementById("menuEmail"); if(el) el.textContent = e;
    el = document.getElementById("sideUserRole"); if(el) el.textContent = roleLabel;
    el = document.getElementById("topUserRole"); if(el) el.textContent = roleLabel;
    el = document.getElementById("greetName"); if(el) el.textContent = first;

    var av = document.getElementById("sideAvatar");
    if(av) {
      if(av.tagName === "IMG") { av.alt = n; }
      else { av.textContent = ini || "U"; }
    }
  } catch(err) {}
}
if (document.readyState === 'loading') {
  document.addEventListener("DOMContentLoaded", initProfile);
} else {
  initProfile();
}
</script>
