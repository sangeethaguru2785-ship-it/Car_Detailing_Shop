<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>404 - Page Not Found | STACKLY Auto Spa</title>
	<link rel="stylesheet" href="css/vendor/bootstrap.min.css">
	<link rel="stylesheet" href="css/fonts.css">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/pages.css">
</head>
<body>
	<nav class="navbar navbar-expand-lg fixed-top" id="navbar">
		<div class="container-fluid px-lg-5 d-flex justify-content-center">
			<a class="navbar-brand mx-auto d-block text-center" href="index.html" style="margin:0 auto;">
				<img src="images/logo.webp" alt="STACKLY Auto Spa" class="brand-logo">
			</a>
		</div>
	</nav>
	<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,rgba(12,14,17,0.98) 0%,#08090b 70%);">
		<section>
			<div class="container">
				<h1 style="font-family:var(--font-d);font-size:clamp(7rem,18vw,14rem);font-weight:800;background:linear-gradient(135deg,#f5a30a 0%,#ff6a2b 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:.8;margin-bottom:2rem;">404</h1>
				<h2 style="font-family:var(--font-d);font-size:clamp(2rem,5vw,3rem);color:#fff;margin-bottom:1rem;">Page Not Found</h2>
				<p style="color:#9fa3ab;max-width:560px;margin:0 auto 2.5rem;">Sorry, the page you are looking for could not be found.</p>
				<div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
					<a href="index.html" class="btn btn-accent btn-lg px-5">Go To Home</a>
					<button onclick="goBack()" class="btn btn-ghost btn-lg px-5">Go Back</button>
				</div>
			</div>
		</section>
	</main>
	<script>
		function goBack(){
			if(window.history.length > 1){
				window.history.back();
			}else{
				window.location.href='index.html';
			}
		}
	</script>
</body>
</html>
