<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>404 - Page Not Found | STACKLY Auto Spa</title>
	<link rel="stylesheet" href="css/vendor/bootstrap.min.css">
	<link rel="stylesheet" href="css/fonts.css">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/pages.css">
	<style>
		.p404-seq > *{
			opacity:0; transform:translateY(30px);
			animation:p404-rise .9s var(--ease, cubic-bezier(.22,.61,.36,1)) forwards;
		}
		.p404-seq > *:nth-child(1){animation-delay:.12s}
		.p404-seq > *:nth-child(2){animation-delay:.24s}
		.p404-seq > *:nth-child(3){animation-delay:.36s}
		.p404-seq > *:nth-child(4){animation-delay:.48s}
		@keyframes p404-rise{
			from{opacity:0; transform:translateY(30px)}
			to{opacity:1; transform:translateY(0)}
		}
		@media (prefers-reduced-motion: reduce){
			.p404-seq > *{opacity:1; transform:none; animation:none}
		}
	</style>
</head>
<body>
	<nav class="navbar navbar-expand-lg fixed-top" id="navbar">
		<div class="container-fluid px-lg-5 d-flex justify-content-center">
			<a class="navbar-brand mx-auto d-block text-center" href="index.html" style="margin:0 auto;">
				<img src="images/logo.webp" alt="STACKLY Auto Spa" class="brand-logo" style="height:46px;">
			</a>
		</div>
	</nav>
	<main style="position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:7rem 1.25rem 4rem;background-color:#08090b;background-image:radial-gradient(ellipse at center,rgba(8,9,11,.72) 0%,rgba(8,9,11,.94) 78%),url('images/hero-home.webp');background-position:center;background-size:cover;background-repeat:no-repeat;">
		<section>
			<div class="container p404-seq">
				<h1 style="font-family:var(--font-d);font-size:clamp(5rem,13vw,10rem);font-weight:800;background:linear-gradient(135deg,#f5a30a 0%,#ff6a2b 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:.8;margin-bottom:2rem;">404</h1>
				<h2 style="font-family:var(--font-d);font-size:clamp(2rem,5vw,3rem);color:#fff;margin-bottom:1rem;">Page Not Found</h2>
				<p style="color:#9fa3ab;max-width:560px;margin:0 auto 2.5rem;">Sorry, the page you are looking for could not be found.</p>
				<div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
					<a href="index.html" class="btn btn-accent btn-lg px-5">Go To Home</a>
					<button onclick="goBack()" class="btn btn-ghost btn-lg px-5">Go Back</button>
				</div>
			</div>
		</section>
	</main>
	<script>
		function goBack(){
			if(window.history.length > 1){
				window.history.back();
			}else{
				window.location.href='index.html';
			}
		}
	</script>
</body>
</html>
